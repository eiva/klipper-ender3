# Motor1
[stepper_x]
step_pin: PE6
dir_pin: !PE5 # Controls direction!
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
position_endstop: -5
position_min: -5
position_max: 230
homing_speed: 50
homing_retract_dist: 0
endstop_pin: ~PF4

[tmc2209 stepper_x]
uart_pin: PC13
#diag_pin: PF4 
run_current: 0.600
stealthchop_threshold: 999999

# Motor2
[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
position_endstop: -3
position_min: -3
position_max: 220
homing_speed: 50
homing_retract_dist: 0
endstop_pin: ~PF3

[tmc2209 stepper_y]
uart_pin: PE3
#diag_pin: PF3
run_current: 0.600
stealthchop_threshold: 999999

# Motor3
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop #~PF2
# position_endstop: 0
position_max: 220
position_min: -2
homing_speed: 8
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PB9
#diag_pin: PF2
run_current: 0.650
stealthchop_threshold: 999999

# Motor 4 (Secondary Z)
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop #~PF2
#endstop_pin: ^PF2

[tmc2209 stepper_z1]
uart_pin: PB5
#diag_pin: PF2
run_current: 0.650
stealthchop_threshold: 999999
